# Queries live in db/queries as SQL and are checked against the schema when
# Go code is generated from them (`sqlc generate`); the result is
# internal/store, which nothing edits by hand.
version: "2"
sql:
  - engine: postgresql
    schema:
      - migrations/20261104174119_create_schema.sql
      - migrations/20261104192839_drop_mobile_wallet_from_bank_accounts.sql
      - migrations/20261104193414_create_feedback.sql
      - migrations/20261105041340_add_profile_to_shops.sql
      - migrations/20261106101222_add_coordinates_to_shops.sql
      - migrations/20261108135517_create_testimonials.sql
      - migrations/20261109090838_add_confirmation_to_transactions.sql
      - migrations/20261109091402_create_reminders.sql
      - migrations/20261109091636_add_plans.sql
      - migrations/20261109092706_create_installment_plans.sql
      - migrations/20261109093840_create_suppliers.sql
      - migrations/20261109094729_create_shop_staff.sql
      - migrations/20261109122240_index_transactions_on_created_at.sql
      - migrations/20261109180605_record_reminder_deliveries.sql
      - migrations/20261109190154_create_sales.sql
      - migrations/20261110013821_add_stock_to_items.sql
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              import: github.com/shopspring/decimal
              type: Decimal
              pointer: true
