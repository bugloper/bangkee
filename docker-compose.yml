# Bangkee on a VM: the server and its PostgreSQL. HTTPS comes from the VM's
# shared Caddy (deploy/bangkee.caddy), which reaches the app over the "edge"
# network; nothing here is published on the host. See README "Deploying".
#
# Needs a .env beside it with BANGKEE_DOMAIN, SECRET_KEY_BASE and POSTGRES_PASSWORD,
# and optionally VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY for Web Push, and the
# three WHATSAPP_* settings for reminders by WhatsApp.
services:
  bangkee:
    build: .
    container_name: bangkee
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bangkee:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/bangkee
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      BANGKEE_HOST: ${BANGKEE_DOMAIN:?set BANGKEE_DOMAIN}
      # Web Push, off when unset. Never change the pair once phones have subscribed.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@bangkee.bt}
      # Reminders by WhatsApp to customers who have not joined (internal/notify/whatsapp.go):
      # off unless all three are set, from Meta's WhatsApp Business Platform.
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_REMINDER_TEMPLATE: ${WHATSAPP_REMINDER_TEMPLATE:-}
    volumes:
      - bangkee-storage:/app/storage
    expose:
      - "3000"
    networks:
      - default
      - edge

  db:
    image: postgres:17-alpine
    container_name: bangkee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bangkee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bangkee
    volumes:
      - bangkee-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bangkee", "-d", "bangkee"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edge:
    external: true

volumes:
  bangkee-db:
  bangkee-storage:
