# Bangkee on Render. Apply with Blueprints → New Blueprint Instance.
#
# Secrets are marked sync:false — Render prompts for them on first apply and
# never stores them in this file. The only ones that are not optional are the
# S3 credentials; everything else degrades.
#
# One service: push delivery and email run inside the server
# process, so there is no worker to deploy alongside it.

databases:
  - name: bangkee-db
    databaseName: bangkee_production
    user: bangkee
    plan: basic-256mb           # the smallest paid tier; free expires after 30 days

services:
  - type: web
    name: bangkee
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bangkee-db
          property: connectionString
      # Signs the short-lived cookies (a pending invite) and password reset
      # links. Sessions are database rows, so changing it signs nobody out.
      # Generated once and kept.
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: BANGKEE_HOST            # e.g. bangkee.onrender.com; used in emails
        sync: false

      # Uploads. Render's disk is rebuilt on every deploy, so payment photos
      # and item photos must live in object storage — S3, Cloudflare R2,
      # Backblaze B2.
      - key: ACTIVE_STORAGE_SERVICE
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT             # only for R2/B2; leave unset for AWS
        sync: false

      # Optional. Each of these is a no-op when unset.
      - key: VAPID_PUBLIC_KEY        # web push
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SMTP_ADDRESS            # notification email
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER_NAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
